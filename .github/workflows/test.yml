name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install ta-lib system library
        run: |
          set -euo pipefail
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          sudo ldconfig

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Ruff format
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Mypy
        run: uv run --python ${{ matrix.python-version }} mypy src

      - name: Pytest
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras

      # Audits the resolved environment rather than a re-resolved requirements
      # file, so the [tool.uv] overrides that lift ccxt's aiohttp and
      # cryptography pins are reflected. --skip-editable drops the local project,
      # which has no PyPI release; vulnerabilities still fail the job.
      - run: uv run pip-audit --skip-editable

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      - name: Validate package metadata
        run: uvx twine check --strict dist/*

      - name: Verify the wheel installs and exposes its entrypoint
        run: |
          set -euo pipefail
          uv venv /tmp/verify
          uv pip install --python /tmp/verify --no-deps dist/*.whl
          test -x /tmp/verify/bin/talib-altcoins-api

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: talib-altcoins-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is built from uv.lock, so it must carry the overridden
      # versions rather than the ones ccxt pins.
      - name: Verify the image ships the audited dependency versions
        run: |
          docker run --rm talib-altcoins-api:ci python -c "
          import aiohttp, cryptography, ccxt, talib_altcoins_api
          print('aiohttp', aiohttp.__version__, '| cryptography', cryptography.__version__, '| ccxt', ccxt.__version__)
          assert aiohttp.__version__ == '3.14.3', aiohttp.__version__
          assert cryptography.__version__ == '50.0.0', cryptography.__version__
          "

      - name: Smoke test the running container
        run: |
          set -euo pipefail
          docker run -d --name api -p 5001:5001 talib-altcoins-api:ci

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5001/healthz >/dev/null && break
            sleep 2
          done

          check() {
            local path="$1" expected="$2"
            local got
            got=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5001${path}")
            if [ "$got" != "$expected" ]; then
              echo "FAIL ${path}: expected ${expected}, got ${got}"
              docker logs api
              docker rm -f api >/dev/null
              exit 1
            fi
            echo "ok   ${path} -> ${got}"
          }

          check /healthz 200
          check /readyz 200
          check /docs 200
          check /metrics 200
          check "/indicators?exchange=not_an_exchange&symbol=BTC/USDT" 404
          check "/indicators?exchange=binance&symbol=BTCUSDT" 422
          check "/indicators?exchange=binance&symbol=BTC/USDT&interval=9d" 422

          curl -sf http://127.0.0.1:5001/healthz | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:5001/metrics | grep -q '^# HELP'

          # Upstream exchanges are reachable from most runners but can be
          # geo-blocked, so this is reported rather than enforced.
          live=$(curl -s -o /tmp/live.json -w '%{http_code}' \
            "http://127.0.0.1:5001/indicators?exchange=binance&symbol=BTC/USDT&interval=1h&limit=200")
          echo "live upstream fetch -> ${live}"
          if [ "$live" = "200" ]; then
            python3 -c "import json;d=json.load(open('/tmp/live.json'));assert len(d)==17;print('  17 indicators, adx=%.3f rsi=%.3f'%(d['adx'],d['rsi']))"
          else
            echo "  skipped end-to-end assertion (upstream returned ${live})"
          fi

          docker rm -f api >/dev/null
