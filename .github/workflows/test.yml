name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install ta-lib system library
        run: |
          set -euo pipefail
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          sudo ldconfig

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Ruff format
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Mypy
        run: uv run --python ${{ matrix.python-version }} mypy src

      - name: Pytest
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv tool install pip-audit
      # ccxt 4.5.70 hard-pins cryptography==49.0.0 and aiohttp==3.14.1, so neither
      # can be upgraded while ccxt is a dependency. Drop these once ccxt relaxes
      # its pins; every other advisory still fails the build.
      - run: |
          uv tool run pip-audit --strict \
            --ignore-vuln CVE-2026-59881 \
            --ignore-vuln CVE-2026-69243 \
            --ignore-vuln CVE-2026-69244 \
            --ignore-vuln CVE-2026-69247 \
            -r <(uv export --no-hashes --no-emit-project --format requirements-txt)
        shell: bash

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      - name: Validate package metadata
        run: uvx twine check --strict dist/*

      - name: Verify the wheel installs and exposes its entrypoint
        run: |
          set -euo pipefail
          uv venv /tmp/verify
          uv pip install --python /tmp/verify --no-deps dist/*.whl
          test -x /tmp/verify/bin/talib-altcoins-api

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: talib-altcoins-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
