[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "talib-altcoins-api"
version = "0.1.0"
description = "FastAPI service exposing TA-Lib technical indicators over OHLCV data fetched via CCXT."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Henrique Breim", email = "henrique@breim.com.br" }]
keywords = ["fastapi", "ta-lib", "ccxt", "technical-analysis", "crypto"]
classifiers = [
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-dotenv>=1.0,<2.0",
  "ccxt>=4.4,<5.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<4.0",
  "TA-Lib>=0.4.32,<1.0",
  "structlog>=24.1,<27.0",
  "asgi-correlation-id>=4.3,<6.0",
  "cachetools>=5.3,<8.0",
  "tenacity>=8.2,<10.0",
  "slowapi>=0.1.9,<1.0",
  "prometheus-fastapi-instrumentator>=8.1,<9.0",
  "sentry-sdk[fastapi]>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "httpx2>=2.0,<3.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<3.0",
  "pre-commit>=3.7,<5.0",
  "pip-audit>=2.7,<3.0",
  "types-cachetools>=5.3,<8.0",
  "pandas-stubs>=2.2,<4.0",
]

[project.scripts]
talib-altcoins-api = "talib_altcoins_api.__main__:main"

[project.urls]
Repository = "https://github.com/breim/TAlib-altcoins-api"

[tool.uv]
# ccxt pins aiohttp and cryptography with ==, holding both on versions with
# known advisories. Override to the patched releases; drop once ccxt catches up.
override-dependencies = [
  "aiohttp>=3.14.3",
  "cryptography>=50.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/talib_altcoins_api"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "C4", "PIE", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_unused_configs = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["talib", "ccxt", "slowapi", "slowapi.*", "prometheus_fastapi_instrumentator"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension",
]

[tool.coverage.run]
branch = true
source = ["talib_altcoins_api"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true
